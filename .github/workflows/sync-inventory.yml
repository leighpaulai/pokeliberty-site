name: Sync inventory from Google Sheet

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch: {}       # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r scripts/requirements.txt

      - name: Build product cards from Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python3 scripts/build_products.py

      - name: Commit and push if changed
        run: |
          git config user.name "poke-liberty-bot"
          git config user.email "actions@github.com"
          git add index.html shop.html images/ data/products.json netlify/functions/products-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync inventory from Google Sheet [automated]"
            git push
          fi
